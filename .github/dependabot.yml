# Weekly update pull requests for GitHub Actions and npm.
# Each update waits 14 days after its release: the same soak rule as the engine pins.
# The npm entry has nothing to update until package.json lands with 0.1.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
