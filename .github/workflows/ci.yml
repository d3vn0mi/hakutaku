name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "lts/*", "node"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The "node" leg is the newest stable release: the alias "node" itself now resolves to
          # prereleases (v27.0.0-alpha), which the pinned engines refuse; a semver "*" skips them, and
          # check-latest asks nodejs.org instead of taking the runner's cached Node.
          node-version: ${{ matrix.node == 'node' && '*' || matrix.node }}
          check-latest: ${{ matrix.node == 'node' }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      # The live sandbox tests fail in CI where their tools do not work, rather than skip, so the
      # tools come before the first test step: bubblewrap; unprivileged user namespaces, which
      # Ubuntu's AppArmor restricts by default; and a systemd user manager that stays up for the
      # whole job (lingering), which the later steps reach through XDG_RUNTIME_DIR. The loop waits
      # up to 30 s for the manager to start; if it never does, the live tests say so.
      - run: |
          sudo apt-get install -y bubblewrap strace
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          for _ in $(seq 30); do
            systemd-run --user --wait --quiet --collect true && break
            sleep 1
          done
      - name: typecheck and lint
        run: npm run typecheck && npm run lint
      - name: unit tests
        run: npm test
      # The deep install, scip-python included, which the oracle and hostile steps build with; its
      # cache key is its own, so that a cache saved without scip-python is never restored here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/hakutaku/engines
          key: hakutaku-engines-deep-${{ runner.os }}-${{ hashFiles('engines.lock.json') }}
      - name: engines
        run: sudo apt-get install -y bubblewrap strace && node dist/cli/main.js engines install --yes --deep
      # The sample's content hash is written for the determinism job, which compares it across
      # the three Node versions, each bundling its own SQLite.
      - name: oracle and golden answers
        run: npm run test:oracle
        env:
          HAKUTAKU_HASH_OUT: ${{ runner.temp }}/sample-hash.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sample-hash-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sample-hash.txt
          if-no-files-found: error
      # Each hostile case through export and extract, with no sandbox, after its control has
      # shown that the fixture fires.
      - name: hostile fixtures
        run: npm run test:hostile
      - name: secret scan
        run: npm run check:secrets
      - name: home paths and stray stores
        run: npm run check:tree

  # One content hash on every SQLite version: each linux leg built the sample and uploaded its
  # hash. Each artifact lands in a directory of its own; there must be three, each one line of 64
  # hex digits (three empty files would be equal too), and all the same.
  determinism:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: sample-hash-*
          path: hashes
      - name: one content hash on every SQLite version
        run: |
          ls hashes/*/sample-hash.txt
          test "$(ls hashes/*/sample-hash.txt | wc -l)" -eq 3
          for f in hashes/*/sample-hash.txt; do
            echo "$f: $(cat "$f")"
            grep -qxE '[0-9a-f]{64}' "$f"
            test "$(wc -l < "$f")" -eq 1
          done
          test "$(sort -u hashes/*/sample-hash.txt | wc -l)" -eq 1

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli/main.js --version
