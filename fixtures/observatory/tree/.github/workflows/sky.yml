name: sky

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check the sample sky data
        run: MAX_AGE_HOURS=0 bash scripts/check-sky.sh sim/tests/data
      - name: test the ephemeris service
        run: |
          cd sim
          python -m pip install -e .
          python -m pytest
