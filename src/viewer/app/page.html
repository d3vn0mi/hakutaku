<!doctype html>
<html lang="en" data-ready="loading">
<head>
<meta charset="utf-8">{{HEAD}}
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>hakutaku</title>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <nav class="crumbs" id="crumbs" aria-label="Where you are in the map"></nav>
    <div class="brand">hakutaku</div>
    <div class="actions">
      <fieldset class="lens" id="lens" aria-label="What the map shows"></fieldset>
      <button type="button" class="btn" id="find-btn">Find<kbd>F</kbd></button>
      <button type="button" class="btn" id="back-btn">Back<kbd>Esc</kbd></button>
    </div>
  </header>

  <aside class="left" aria-label="Search and filters">
    <div class="search">
      <input id="q" type="search" placeholder="File, function or library" autocomplete="off" spellcheck="false" aria-label="Find in the code map" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <div class="results" id="results" role="listbox" aria-label="Matches" hidden></div>
    </div>
    <div>
      <h3 id="depth-title">Depth</h3>
      <fieldset class="seg rows" id="depth" aria-labelledby="depth-title"></fieldset>
    </div>
    <div>
      <h3 id="group-title">Group by</h3>
      <fieldset class="seg" id="group" aria-labelledby="group-title"></fieldset>
    </div>
    <div>
      <h3>Show</h3>
      <div class="toggles" id="show"></div>
    </div>
    <div>
      <h3>Filters</h3>
      <div class="filters" id="filters"></div>
    </div>
    <div class="keys">
      <h3>Keys</h3>
      <p><kbd>F</kbd> find &middot; <kbd>Esc</kbd> back one level &middot; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> lenses &middot; <kbd>D</kbd> depth &middot; <kbd>L</kbd> list</p>
    </div>
  </aside>

  <main class="map" id="map" aria-label="Code map">
    <canvas id="edges" aria-hidden="true"></canvas>
    <div id="sigma"></div>
    <p class="map-notice" id="map-notice" hidden></p>
    <div class="caption">
      <p class="legend" id="legend"></p>
      <p class="coverage" id="coverage" hidden></p>
    </div>
    <section class="list-view" id="list-view" aria-label="Files, ranked" hidden></section>
    <div class="statband" id="statband"></div>
    <fieldset class="zoom" aria-label="Zoom">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
      <button type="button" id="zoom-fit" aria-label="Fit the map">fit</button>
    </fieldset>
    <span class="crosshair crosshair-top" aria-hidden="true"></span>
    <span class="crosshair crosshair-bottom" aria-hidden="true"></span>
    <div class="toast" id="toast" role="status" hidden></div>
  </main>

  <aside class="right" id="detail" aria-label="Details" hidden></aside>

  <footer class="bottom">
    <section>
      <h3>Core<small>what the rest depends on</small></h3>
      <ol class="rank" id="core-list"></ol>
    </section>
    <section>
      <h3>Change activity<small>commits per week, last 26 weeks</small></h3>
      <svg id="timeline" role="img" aria-label="Commits per week, last 26 weeks"></svg>
    </section>
    <section>
      <h3>Hotspots<small>depended on and changing often</small></h3>
      <ol class="rank" id="hot-list"></ol>
    </section>
  </footer>
</div>
<p class="visually-hidden" id="announce" aria-live="polite" aria-atomic="true"></p>
<p class="fatal" id="fatal" role="alert" hidden></p>
{{TAIL}}
</body>
</html>
