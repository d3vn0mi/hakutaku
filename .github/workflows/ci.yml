name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "lts/*", "node"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The "node" leg is the newest stable release: the alias "node" itself now resolves to
          # prereleases (v27.0.0-alpha), which the pinned engines refuse; a semver "*" skips them.
          node-version: ${{ matrix.node == 'node' && '*' || matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: typecheck and lint
        run: npm run typecheck && npm run lint
      - name: unit tests
        run: npm test
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/hakutaku/engines
          key: hakutaku-engines-${{ runner.os }}-${{ hashFiles('engines.lock.json') }}
      - name: engines
        run: sudo apt-get install -y bubblewrap strace && node dist/cli/main.js engines install --yes
      - name: oracle and golden answers
        run: npm run test:oracle
      - name: secret scan
        run: npm run check:secrets
      - name: home paths and stray stores
        run: npm run check:tree

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli/main.js --version
